<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tarot IA - El Oráculo Estelar</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="particles-js"></div>

    <div class="pantalla-inicio">
        <div class="cuadro-frase" id="frase-polvo">
            "El destino se escribe entre las estrellas"
        </div>

        <button class="btn-oraculo" onclick="iniciarLectura()">Consultar al Oráculo</button>
        
        <div class="ads-superior">
            <p style="color: #666; font-size: 10px;">PUBLICIDAD</p>
        </div>
    </div>

    <div id="escena-oraculo" class="oculto">
        <div class="encapuchado">
            <div class="esfera-celeste"></div>
        </div>
        <div id="mazo-siete" class="cartas-layout"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>
    <script src="script.js"></script>

</html>
